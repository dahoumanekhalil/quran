name: Prototype build (Mushaf rendering)

# Builds the Phase 2 rendering prototype on GitHub-hosted Ubuntu runners
# and publishes app-debug.apk as a workflow artifact. Aligns with ADR-0023
# (phone-first workflow — no local Android SDK required).

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/rendering/**'
      - '.github/workflows/prototype-build.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble debug APK
        working-directory: prototype/rendering
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK for clarity
        working-directory: prototype/rendering
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/mushaf-prototype-${{ github.run_number }}.apk
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mushaf-prototype-apk
          path: prototype/rendering/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
