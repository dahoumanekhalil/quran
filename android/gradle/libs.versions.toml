[versions]
agp = "8.7.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"
hiltNavigationCompose = "1.2.0"
composeBom = "2024.10.01"
activityCompose = "1.9.3"
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.7"
lifecycleViewmodelCompose = "2.8.7"
navigationCompose = "2.8.4"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
sqliteFramework = "2.4.0"
datastore = "1.1.1"
room = "2.6.1"
junit = "5.11.3"
androidJunit5Plugin = "1.11.2.0"
turbine = "1.2.0"
truth = "1.4.4"
mockk = "1.13.13"
spotless = "6.25.0"
ktlint = "1.3.1"

[libraries]
androidx-core-ktx           = { group = "androidx.core",          name = "core-ktx",             version.ref = "coreKtx" }
androidx-lifecycle-runtime  = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose   = { group = "androidx.activity",      name = "activity-compose",     version.ref = "activityCompose" }
androidx-compose-bom        = { group = "androidx.compose",       name = "compose-bom",          version.ref = "composeBom" }
androidx-ui                 = { group = "androidx.compose.ui",    name = "ui" }
androidx-ui-graphics        = { group = "androidx.compose.ui",    name = "ui-graphics" }
androidx-ui-tooling         = { group = "androidx.compose.ui",    name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
androidx-material3          = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-foundation         = { group = "androidx.compose.foundation", name = "foundation" }
androidx-navigation-compose = { group = "androidx.navigation",    name = "navigation-compose",   version.ref = "navigationCompose" }
androidx-sqlite-framework   = { group = "androidx.sqlite",        name = "sqlite-framework",     version.ref = "sqliteFramework" }
androidx-sqlite-ktx         = { group = "androidx.sqlite",        name = "sqlite-ktx",           version.ref = "sqliteFramework" }
androidx-datastore-preferences = { group = "androidx.datastore",  name = "datastore-preferences", version.ref = "datastore" }
androidx-room-runtime       = { group = "androidx.room",          name = "room-runtime",         version.ref = "room" }
androidx-room-ktx           = { group = "androidx.room",          name = "room-ktx",             version.ref = "room" }
androidx-room-compiler      = { group = "androidx.room",          name = "room-compiler",        version.ref = "room" }

kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-test",    version.ref = "kotlinxCoroutines" }

hilt-android                = { group = "com.google.dagger",      name = "hilt-android",         version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",      name = "hilt-compiler",        version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",          name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

junit-jupiter-api           = { group = "org.junit.jupiter",      name = "junit-jupiter-api",    version.ref = "junit" }
junit-jupiter-engine        = { group = "org.junit.jupiter",      name = "junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params        = { group = "org.junit.jupiter",      name = "junit-jupiter-params", version.ref = "junit" }
turbine                     = { group = "app.cash.turbine",       name = "turbine",              version.ref = "turbine" }
truth                       = { group = "com.google.truth",       name = "truth",                version.ref = "truth" }
mockk                       = { group = "io.mockk",               name = "mockk",                version.ref = "mockk" }

[plugins]
android-application         = { id = "com.android.application",   version.ref = "agp" }
android-library             = { id = "com.android.library",       version.ref = "agp" }
kotlin-android              = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm",  version.ref = "kotlin" }
kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt                        = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp                         = { id = "com.google.devtools.ksp",   version.ref = "ksp" }
spotless                    = { id = "com.diffplug.spotless",     version.ref = "spotless" }
android-junit5              = { id = "de.mannodermaus.android-junit5", version.ref = "androidJunit5Plugin" }
